# Check that the technical writing reflection is complete
- writing/reflection.md:
  - description: Ensure that reflection.md exists in the writing/ directory
    check: ConfirmFileExists
  - description: Complete all TODOs and remove the TODO markers from writing/reflection.md
    check: MatchFileFragment
    options:
      fragment: TODO
      count: 0
      exact: true
  - description: Replace the name prompt in writing/reflection.md
    check: MatchFileFragment
    options:
      fragment: "Add Your Name Here"
      count: 0
      exact: true

